<div class="login">
  <div class="login__card">
    <h2 class="login__title">Iniciar sesión</h2>

    <form [formGroup]="form" (ngSubmit)="login()" class="login__form">
      <div class="login__field">
        <label for="username">Usuario</label>
        <input id="username" type="text" formControlName="username" placeholder="admin" />
      </div>

      <div class="login__field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
      </div>

      @if (error) {
        <p class="login__error">{{ error }}</p>
      }

      <button type="submit" class="login__btn" [disabled]="form.invalid">Entrar</button>
    </form>
  </div>
</div>
